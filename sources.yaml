# Rate limits and auth
# Hacker News: free, ~100 req/hr
# GitHub: 60 req/hr unauthenticated, 5000/hr with token
# arXiv: No strict limit, respectful ~1-2 sec delay
# Reddit: ~60 requests/min
# RSS feeds: Typically one fetch/day per source

# Skip (reasons noted)
skip:
