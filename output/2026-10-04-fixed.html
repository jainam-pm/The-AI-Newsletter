<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Morning Prompt — Daily AI News</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #faf6eb; color: #1a1710; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        .header { margin-bottom: 40px; border-bottom: 2px solid #d4a04a; padding-bottom: 20px; }
        .header h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .header .meta { font-size: 14px; color: #666; }
        .content { display: grid; grid-template-columns: 1fr 300px; gap: 40px; }
        .stories { display: flex; flex-direction: column; gap: 30px; }
        .sidebar { padding: 20px; background: #2a1710; color: #faf6eb; border-radius: 8px; height: fit-content; position: sticky; top: 20px; }
        .story { border: 1px solid #e0d5c7; border-radius: 4px; overflow: hidden; transition: box-shadow 0.2s; }
        .story:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .story-header { padding: 20px; cursor: pointer; display: flex; gap: 16px; background: #fef9f3; align-items: flex-start; }
        .story-number { font-size: 28px; font-weight: 300; color: #d4a04a; min-width: 40px; opacity: 0.6; }
        .story-header-content { flex: 1; }
        .story-cat { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: white; margin-bottom: 8px; }
        .story-headline { font-size: 18px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
        .story-deck { font-size: 14px; color: #666; line-height: 1.4; }
        .story-body { display: none; padding: 20px; background: #fff; border-top: 1px solid #e0d5c7; }
        .story.expanded .story-body { display: block; }
        .story-rows { margin: 20px 0; }
        .story-row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; margin-bottom: 12px; }
        .story-row strong { color: #1a1710; font-weight: 600; }
        .story-row-value { color: #444; }
        .story-vs { margin: 20px 0; padding: 12px; background: #fef9f3; border-radius: 4px; }
        .story-vs-header { font-weight: 600; margin-bottom: 8px; font-size: 13px; }
        .story-vs-item { margin-bottom: 8px; font-size: 14px; }
        .story-vs-item strong { color: #1a1710; }
        .story-links { margin: 20px 0; padding: 12px; background: #fef9f3; border-radius: 4px; }
        .story-links-header { font-weight: 600; margin-bottom: 8px; font-size: 13px; }
        .story-link { display: block; margin-bottom: 6px; }
        .story-link a { color: #2a6fa8; text-decoration: none; font-size: 14px; }
        .story-link a:hover { text-decoration: underline; }
        .story-votes { margin-top: 16px; display: flex; gap: 8px; }
        .vote-btn { padding: 6px 12px; border: 1px solid #d4a04a; background: transparent; color: #1a1710; border-radius: 4px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .vote-btn:hover { background: #d4a04a; color: #faf6eb; }
        .word-of-day h2 { font-size: 14px; font-weight: 600; text-transform: uppercase; color: #d4a04a; margin-bottom: 16px; }
        .word-card { background: #3a2710; padding: 16px; border-radius: 6px; }
        .word-term { font-size: 20px; font-weight: 700; color: #d4a04a; margin-bottom: 8px; }
        .word-pos { font-size: 12px; color: #aaa; margin-bottom: 12px; }
        .word-def { font-size: 13px; line-height: 1.5; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #5a4a3a; }
        .word-why { font-size: 12px; line-height: 1.5; margin-bottom: 12px; }
        .word-tie { font-size: 11px; color: #aaa; font-style: italic; }
        @media (max-width: 820px) {
            .content { grid-template-columns: 1fr; }
            .sidebar { position: static; }
            .story-header { flex-direction: column; gap: 8px; }
            .story-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>The Morning Prompt</h1>
            <div class="meta">Daily AI news digest • October 4, 2026</div>
        </div>
        <div class="content">
            <div class="stories" id="stories"></div>
            <div class="sidebar">
                <div class="word-of-day">
                    <h2>Word of the Day</h2>
                    <div class="word-card" id="word-card"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
    <script>
        const STORIES = [
            {"id":"s1","cat":"privacy","n":"01","head":"OpenAI Safety Officer Resigns: 'Culture is Broken'","deck":"High-profile departure signals internal discord over alignment priorities.","rows":[["Who","A senior safety researcher at OpenAI"],["What","Resigned claiming safety culture deteriorated after recent leadership changes."],["When","Effective October 3, 2026."],["Where","OpenAI (San Francisco)"],["Why","Frustration with deprioritization of alignment research."],["How","Public resignation letter urging others to speak up."]],"vs":[["Anthropic","Maintains constitutional AI approach"],["DeepSeek","Rapidly scaling; minimal safety commitments"],["Meta","Open-weights; responsible AI initiatives"]],"links":[["OpenAI News","https://openai.com"]]},
            {"id":"s2","cat":"models","n":"02","head":"NVIDIA DGX Spark: Local AI Inference Half the Cost","deck":"New compact GPU system brings enterprise inference to on-prem, cutting latency by 10x.","rows":[["Who","NVIDIA, CoreWeave"],["What","DGX Spark 64GB - 4-GPU system for open-weights LLMs"],["When","Shipping October 15, 2026"],["Where","On-premises deployment"],["Why","Avoid cloud API latency and per-token costs"],["How","Plug in, deploy via NVIDIA NIM runtime"]],"vs":[["Apple","M4 MacBooks run 7B models locally"],["AWS Trainium","Higher cost, more complex"],["Azure ML","Cloud-based, higher latency"]],"links":[["NVIDIA","https://nvidia.com"]]},
            {"id":"s3","cat":"security","n":"03","head":"Apple Tightens macOS Full Disk Access After Meta Muse","deck":"New OS restrictions block surveillance-capable apps, raising privacy bar.","rows":[["What","macOS 15.1 restricts Full Disk Access"],["Why","Users reported Meta Muse recording without consent"],["When","Available now"],["Where","macOS Sonoma"]],"vs":[["Windows","Copilot Recall faces backlash"],["Android 15","Agents sandboxed by default"],["Meta","Pivoting to AR glasses"]],"links":[["Apple","https://apple.com"]]},
            {"id":"s4","cat":"builders","n":"04","head":"AI Agents Now Live in Your Text Messages","deck":"Claude, ChatGPT, Gemini launch SMS integration reaching billions without apps.","rows":[["Who","Anthropic, OpenAI, Google, Meta"],["What","SMS-based agent access launched"],["When","Sept 28 - Oct 2, 2026"],["Where","Global SMS access"],["Why","SMS reaches 2B people without smartphones"],["How","Text a prompt, agents respond"]],"vs":[["Mistral","SMS in Latin America"],["Microsoft","Copilot SMS beta"],["Perplexity","SMS search"]],"links":[["Anthropic","https://anthropic.com"]]},
            {"id":"s5","cat":"builders","n":"05","head":"Meta Pivots Muse From Mac to AR Glasses","deck":"After screen-recording backlash, Meta refocuses on Ray-Ban wearables.","rows":[["What","Muse discontinued on desktop; launching on Ray-Ban glasses"],["Why","Desktop Muse faced privacy backlash"],["When","October 5, 2026"],["Where","Ray-Ban smart glasses"]],"vs":[["Humane AI Pin","Limited uptake"],["Apple Glasses","2027 launch"],["Google Glass","Legacy AR"]],"links":[["Meta","https://meta.com"]]}
        ];

        const WORD = {"term":"Agentic Loop","pos":"noun · AI architecture","def":"Repeating cycle where AI observes, decides, and executes autonomously.","why":"Foundation of next-gen AI systems that work on your behalf.","tie":"Ties to Stories #1 & #4: SMS agents and safety highlight agentic power and controversy."};

        const CATS = {privacy:{label:"Agents & Privacy",color:"#7a3ea0"},models:{label:"Models",color:"#2a6fa8"},security:{label:"Security",color:"#b33425"},builders:{label:"Builders & Funding",color:"#4db87a"}};

        function renderStories() {
            const container = document.getElementById('stories');
            if (!container) { console.error('Container #stories not found'); return; }

            STORIES.forEach((story, idx) => {
                const cat = CATS[story.cat] || {label:"News",color:"#999"};

                let rows = '';
                if (story.rows && story.rows.length) {
                    rows = '<div class="story-rows">' + story.rows.map(r => `<div class="story-row"><strong>${r[0]}</strong><div class="story-row-value">${r[1]}</div></div>`).join('') + '</div>';
                }

                let vs = '';
                if (story.vs && story.vs.length) {
                    vs = '<div class="story-vs"><div class="story-vs-header">vs</div>' + story.vs.map(v => `<div class="story-vs-item"><strong>${v[0]}</strong> ${v[1]}</div>`).join('') + '</div>';
                }

                let links = '';
                if (story.links && story.links.length) {
                    links = '<div class="story-links"><div class="story-links-header">Links</div>' + story.links.map(l => `<div class="story-link"><a href="${l[1]}" target="_blank">${l[0]}</a></div>`).join('') + '</div>';
                }

                const html = `<div class="story ${idx===0?'expanded':''}" data-id="${story.id}">
                    <div class="story-header" onclick="toggleStory(${idx})">
                        <div class="story-number">${story.n}</div>
                        <div class="story-header-content">
                            <div class="story-cat" style="background-color:${cat.color}">${cat.label}</div>
                            <div class="story-headline">${story.head}</div>
                            <div class="story-deck">${story.deck}</div>
                        </div>
                    </div>
                    <div class="story-body">
                        <a href="${story.links?.[0]?.[1]||'#'}" target="_blank" style="color:#2a6fa8;text-decoration:none;font-weight:600;">Read full story →</a>
                        ${rows}${vs}${links}
                        <div class="story-votes">
                            <button class="vote-btn" onclick="vote('${story.id}','up',this)">👍 More like this</button>
                            <button class="vote-btn" onclick="vote('${story.id}','down',this)">👎 Less</button>
                        </div>
                    </div>
                </div>`;

                container.innerHTML += html;
            });
        }

        function renderWord() {
            const container = document.getElementById('word-card');
            if (!container) return;
            container.innerHTML = `<div class="word-term">${WORD.term}</div>
                <div class="word-pos">${WORD.pos}</div>
                <div class="word-def">${WORD.def}</div>
                <div class="word-why"><strong>Why:</strong> ${WORD.why}</div>
                <div class="word-tie">${WORD.tie}</div>`;
        }

        function toggleStory(idx) {
            document.querySelectorAll('.story')[idx].classList.toggle('expanded');
        }

        async function vote(storyId, type, btn) {
            btn.disabled = true;
            btn.textContent = type==='up'?'👍 Voted!':'👎 Noted!';
            btn.style.background = '#4db87a';
            btn.style.color = '#faf6eb';

            setTimeout(() => { btn.disabled = false; btn.style.background = 'transparent'; btn.style.color = '#1a1710'; }, 800);

            const sessionId = localStorage.getItem('session') || ('u-' + Date.now());
            localStorage.setItem('session', sessionId);

            try {
                let sb = null;
                for (let i = 0; i < 10; i++) {
                    if (window.supabase) {
                        sb = window.supabase.createClient('https://mzsipmeuthconogugwry.supabase.co', 'sb_publishable_AHLzBSVlyyQJSKIZFD2Nyg_R2WHJfMG');
                        break;
                    }
                    await new Promise(r => setTimeout(r, 100));
                }

                if (!sb) throw new Error('Supabase not loaded');

                const {data:stories,error:err1} = await sb.from('stories').select('id').eq('story_id', storyId).limit(1);
                if (err1 || !stories?.length) throw new Error('Story not found');

                const {error:err2} = await sb.from('votes').insert({story_id:stories[0].id,vote_type:type,user_id:sessionId});
                if (err2) throw err2;

                console.log(`Vote recorded: ${type} on ${storyId}`);
            } catch(e) {
                console.error('Vote failed:', e);
            }
        }

        // Render immediately - no DOMContentLoaded needed
        renderStories();
        renderWord();
    </script>
</body>
</html>
