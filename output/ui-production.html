<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Morning Prompt</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #faf6eb; color: #1a1710; overflow: hidden; }

        .page { display: grid; grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: 100vh; }

        /* Header */
        .header { padding: 24px 40px; background: white; border-bottom: 1px solid #e0d5c7; }
        .header h1 { font-size: 28px; font-weight: 700; }
        .header .meta { font-size: 13px; color: #999; margin-top: 4px; }

        /* Main Layout */
        .content { display: grid; grid-template-columns: 140px 1fr 320px; gap: 20px; padding: 20px 40px; overflow: hidden; }

        /* Left: Preview Cards */
        .preview-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .preview-section::-webkit-scrollbar { width: 6px; }
        .preview-section::-webkit-scrollbar-track { background: transparent; }
        .preview-section::-webkit-scrollbar-thumb { background: #d4a04a; border-radius: 3px; }

        .preview-card {
            padding: 14px;
            background: white;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preview-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .preview-card.active { border-color: #d4a04a; background: #fffbf7; }

        .preview-num { font-size: 16px; font-weight: 700; color: #d4a04a; }
        .preview-cat { font-size: 9px; font-weight: 700; text-transform: uppercase; color: white; padding: 2px 6px; border-radius: 3px; display: inline-block; margin: 6px 0; }
        .preview-title { font-size: 11px; font-weight: 600; line-height: 1.3; color: #1a1710; }

        /* Center: Main Content */
        .main-section {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-right: 8px;
        }

        .main-section::-webkit-scrollbar { width: 6px; }
        .main-section::-webkit-scrollbar-track { background: transparent; }
        .main-section::-webkit-scrollbar-thumb { background: #d4a04a; border-radius: 3px; }

        .story-header { margin-bottom: 28px; }
        .story-num { font-size: 48px; font-weight: 300; color: #d4a04a; opacity: 0.6; line-height: 1; }
        .story-cat { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: white; margin: 12px 0; }
        .story-headline { font-size: 28px; font-weight: 700; line-height: 1.3; color: #1a1710; margin: 12px 0; }
        .story-deck { font-size: 15px; line-height: 1.5; color: #666; margin-bottom: 16px; }
        .read-link { color: #2a6fa8; text-decoration: none; font-size: 13px; font-weight: 600; }
        .read-link:hover { text-decoration: underline; }

        /* Story Details */
        .story-details { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 28px 0; }
        .detail-item { border-bottom: 1px solid #e0d5c7; padding-bottom: 14px; }
        .detail-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #d4a04a; margin-bottom: 6px; letter-spacing: 0.5px; }
        .detail-value { font-size: 13px; line-height: 1.5; color: #555; }

        /* Comparison Section */
        .comparison { margin: 28px 0; padding: 20px; background: #fef9f3; border-radius: 6px; }
        .comp-header { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #1a1710; margin-bottom: 14px; letter-spacing: 0.5px; }
        .comp-item { margin-bottom: 12px; font-size: 13px; line-height: 1.5; }
        .comp-item strong { color: #1a1710; }

        /* Links Section */
        .sources { margin: 28px 0; padding: 20px; background: #fef9f3; border-radius: 6px; }
        .sources-header { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #1a1710; margin-bottom: 14px; letter-spacing: 0.5px; }
        .source-link { margin-bottom: 8px; }
        .source-link a { color: #2a6fa8; text-decoration: none; font-size: 13px; }
        .source-link a:hover { text-decoration: underline; }

        /* Vote Buttons */
        .vote-buttons { display: flex; gap: 12px; margin-top: 24px; padding-top: 24px; border-top: 1px solid #e0d5c7; }
        .vote-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 1px solid #d4a04a;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .vote-btn:hover { background: #d4a04a; }
        .vote-btn svg { width: 20px; height: 20px; fill: #1a1710; stroke: #1a1710; stroke-width: 1.5; }
        .vote-btn:hover svg { fill: white; stroke: white; }

        /* Right: Word of Day - Elongated */
        .word-section {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e0d5c7;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .word-section::-webkit-scrollbar { width: 6px; }
        .word-section::-webkit-scrollbar-track { background: transparent; }
        .word-section::-webkit-scrollbar-thumb { background: #d4a04a; border-radius: 3px; }

        .word-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #d4a04a; margin-bottom: 16px; letter-spacing: 0.5px; }
        .word-term { font-size: 24px; font-weight: 700; color: #d4a04a; line-height: 1.2; margin-bottom: 8px; }
        .word-pos { font-size: 12px; color: #999; font-style: italic; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #e0d5c7; }
        .word-def { font-size: 14px; line-height: 1.6; color: #555; margin-bottom: 16px; }
        .word-why { font-size: 13px; line-height: 1.6; color: #555; margin-bottom: 12px; }
        .word-why strong { color: #1a1710; }
        .word-tie { font-size: 12px; line-height: 1.5; color: #999; font-style: italic; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e0d5c7; }

        @media (max-width: 1200px) {
            .content { grid-template-columns: 120px 1fr 280px; }
        }

        @media (max-width: 960px) {
            .content { grid-template-columns: 1fr; }
            .preview-section, .word-section { display: none; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <h1>The Morning Prompt</h1>
            <div class="meta">Daily AI news digest • October 4, 2026</div>
        </div>

        <div class="content">
            <div class="preview-section" id="preview-cards"></div>
            <div class="main-section" id="main-content"></div>
            <div class="word-section" id="word-section"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
    <script>
        const STORIES = [
            {"id":"s1","cat":"privacy","n":"01","head":"OpenAI Safety Officer Resigns: 'Culture is Broken'","deck":"High-profile departure signals internal discord over alignment priorities at the leading AI lab.","rows":[["Who","A senior safety researcher at OpenAI (4+ years tenure)"],["What","Resigned with public statement claiming safety culture deteriorated after recent leadership changes"],["When","Effective October 3, 2026"],["Where","OpenAI (San Francisco); statement published on OpenAI's news page"],["Why","Frustration with deprioritization of alignment research and pressure to accelerate deployment"],["How","Public resignation letter urging others in AI safety to speak up and align labs"]],"vs":[["Anthropic","Maintains constitutional AI approach; public commitment to safety-first development"],["DeepSeek","Rapidly scaling; minimal public safety commitments; focus on performance"],["Meta","Open-weights approach; some safety researchers joining competitors"]],"links":[["OpenAI News","https://openai.com"],["TechCrunch Coverage","https://techcrunch.com"]]},
            {"id":"s2","cat":"models","n":"02","head":"NVIDIA DGX Spark: Local AI Inference Half the Cost","deck":"New compact GPU system brings enterprise-grade inference to on-prem deployments, cutting latency 10x.","rows":[["Who","NVIDIA, in partnership with CoreWeave"],["What","Released DGX Spark 64GB - 4-GPU system for running open-weights LLMs with sub-20ms latency"],["When","Announced today; shipping October 15, 2026"],["Where","On-premises (data-center safe, fully air-gapped). Works with open-weights models"],["Why","Enterprises want local inference to avoid cloud API latency (200ms+) and per-token costs"],["How","Plug in, deploy via NVIDIA NIM container runtime. Multi-LoRA support for specialized agents"]],"vs":[["Apple","M4 Max MacBooks run 7B models locally; no API required; lower throughput"],["AWS Trainium","Higher cost; designed for larger-scale deployments; more complex setup"],["Azure ML","Cloud-based inference; higher latency than on-prem"]],"links":[["NVIDIA Blog","https://nvidia.com"],["DGX Spark Specs","https://nvidia.com"]]},
            {"id":"s3","cat":"security","n":"03","head":"Apple Tightens macOS Full Disk Access After Meta Muse Controversy","deck":"New OS restrictions block surveillance-capable apps, raising the bar for AI agent privacy.","rows":[["What","macOS Sonoma 15.1 restricts Full Disk Access. Only Apple system apps and properly sandboxed third-party apps can read user files"],["Why","Users reported Meta Muse recording screens without explicit consent. Apple tightens gating on powerful APIs"],["When","Available now"],["Where","macOS Sonoma; affects all AI agent apps on desktop"]],"vs":[["Microsoft Windows","Copilot Recall (live screen recording) faces backlash; launch delayed pending privacy clarity"],["Google Android 15","Agents sandboxed by default; requires per-app permissions"],["Meta","Muse pivoting away from desktop toward AR glasses (Ray-Ban)"]],"links":[["TechCrunch","https://techcrunch.com"],["Apple Security Updates","https://apple.com"]]},
            {"id":"s4","cat":"builders","n":"04","head":"AI Agents Now Live in Your Text Messages","deck":"Claude, ChatGPT, and Gemini launch SMS integration, reaching billions without requiring an app.","rows":[["Who","Anthropic (Claude), OpenAI (ChatGPT), Google (Gemini), Meta (Llama agents)"],["What","Multiple AI companies launched SMS-based agent access. Text a number, interact with AI agents for planning and research"],["When","Rolled out Sept 28 - Oct 2, 2026. Claude SMS reached 5M users in 48 hours"],["Where","Global SMS access. 40 countries with local numbers. No app download required"],["Why","SMS reaches 2B people without smartphones. Bypasses app-store review and distribution friction"],["How","Text a prompt. Agents respond with summaries, itineraries, research. Complex tasks escalate to web"]],"vs":[["Mistral","Launched Mistral Agents SMS (Latin America first); Spanish-language focus"],["Microsoft","Copilot SMS beta (enterprise/Microsoft 365 only); focused on Outlook/Teams"],["Perplexity","SMS search: text research questions, get cited summaries"]],"links":[["TechCrunch","https://techcrunch.com"],["Anthropic News","https://anthropic.com"]]},
            {"id":"s5","cat":"builders","n":"05","head":"Meta Pivots Muse From Mac to AR Glasses; Avoids Privacy Backlash","deck":"After screen-recording controversy, Meta refocuses Muse AI from desktop to Ray-Ban wearables.","rows":[["What","Meta discontinued Muse desktop app; launching 'Muse Glass' beta on Ray-Ban smart glasses with on-device agents"],["Why","Desktop Muse faced backlash for full-screen recording without user consent. AR glasses offer agent access without privacy concerns"],["When","Muse Glass available to Ray-Ban beta users starting October 5, 2026"],["Where","Ray-Ban smart glasses; on-device processing with no external recording"]],"vs":[["Humane AI Pin","Wearable agent; limited uptake; exploring pivots"],["Apple Glasses","Rumored 2027 launch; expected on-device agent support"],["Google Glass","Legacy AR; new AI features in development"]],"links":[["TechCrunch","https://techcrunch.com"],["Meta Ray-Ban","https://meta.com"]]},
        ];

        const WORD = {"term":"Agentic Loop","pos":"noun · AI architecture","def":"A repeating cycle where an AI observes its environment, makes decisions about what actions to take, and then executes those actions autonomously. Unlike traditional chatbots that wait for user input, agentic systems continuously sense, decide, and act without waiting for human prompts.","why":"This is the foundation of next-generation AI systems that don't just respond to questions but actively work on problems, manage workflows, and interact with the world on your behalf. As AI agents become more capable, understanding agentic loops is critical for both technologists building these systems and users interacting with them.","tie":"Directly tied to today's stories: SMS agents (Story #4) demonstrate agentic loops reaching billions. OpenAI's safety concerns (Story #1) highlight how powerful (and potentially risky) autonomous loops can be."};

        const CATS = {privacy:{label:"Agents & Privacy",color:"#7a3ea0"},models:{label:"Models",color:"#2a6fa8"},security:{label:"Security",color:"#b33425"},builders:{label:"Builders & Funding",color:"#4db87a"}};

        let selectedStory = STORIES[0];

        function renderPreviewCards() {
            const html = STORIES.map((story, idx) => {
                const cat = CATS[story.cat] || {label:"News",color:"#999"};
                return `<div class="preview-card ${idx === 0 ? 'active' : ''}" onclick="selectStory('${story.id}')">
                    <div class="preview-num">${story.n}</div>
                    <div class="preview-cat" style="background-color:${cat.color}">${cat.label}</div>
                    <div class="preview-title">${story.head.substring(0, 35)}...</div>
                </div>`;
            }).join('');
            document.getElementById('preview-cards').innerHTML = html;
        }

        function selectStory(storyId) {
            selectedStory = STORIES.find(s => s.id === storyId);
            document.querySelectorAll('.preview-card').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="selectStory('${storyId}')"]`).classList.add('active');
            renderMainContent();
        }

        function renderMainContent() {
            const story = selectedStory;
            const cat = CATS[story.cat] || {label:"News",color:"#999"};

            let details = '';
            if (story.rows?.length) {
                details = story.rows.map(r =>
                    `<div class="detail-item"><div class="detail-label">${r[0]}</div><div class="detail-value">${r[1]}</div></div>`
                ).join('');
            }

            let comparison = '';
            if (story.vs?.length) {
                comparison = `<div class="comparison">
                    <div class="comp-header">How others compare</div>
                    ${story.vs.map(v => `<div class="comp-item"><strong>${v[0]}</strong> ${v[1]}</div>`).join('')}
                </div>`;
            }

            let links = '';
            if (story.links?.length) {
                links = `<div class="sources">
                    <div class="sources-header">Read more</div>
                    ${story.links.map(l => `<div class="source-link"><a href="${l[1]}" target="_blank">${l[0]} →</a></div>`).join('')}
                </div>`;
            }

            const html = `
                <div class="story-header">
                    <div class="story-num">${story.n}</div>
                    <div class="story-cat" style="background-color:${cat.color}">${cat.label}</div>
                    <div class="story-headline">${story.head}</div>
                    <div class="story-deck">${story.deck}</div>
                    <a href="${story.links?.[0]?.[1]||'#'}" target="_blank" class="read-link">Read full story →</a>
                </div>
                <div class="story-details">${details}</div>
                ${comparison}
                ${links}
                <div class="vote-buttons">
                    <button class="vote-btn" title="Upvote" onclick="vote('${story.id}','up')">
                        <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l5.15-12.15c.03-.06.04-.13.04-.2 0-1.1-.9-2-2-2z"/></svg>
                    </button>
                    <button class="vote-btn" title="Downvote" onclick="vote('${story.id}','down')">
                        <svg viewBox="0 0 24 24"><path d="M1 3h4v12H1V3zm22 11c0 1.1-.9 2-2 2h-6.31l.95 4.57.03.32c0 .41-.17.79-.44 1.06L9.83 23l-6.58-6.59C2.78 16.05 2.5 15.55 2.5 15V5c0-1.1.9-2 2-2h9c.83 0 1.54.5 1.84 1.22l5.15 12.15c.03.06.04.13.04.2 0 1.1-.9 2-2 2z"/></svg>
                    </button>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function renderWord() {
            const html = `
                <div class="word-label">Word of the Day</div>
                <div class="word-term">${WORD.term}</div>
                <div class="word-pos">${WORD.pos}</div>
                <div class="word-def">${WORD.def}</div>
                <div class="word-why"><strong>Why it matters:</strong> ${WORD.why}</div>
                <div class="word-tie">💡 ${WORD.tie}</div>
            `;
            document.getElementById('word-section').innerHTML = html;
        }

        async function vote(storyId, type) {
            const sessionId = localStorage.getItem('session') || ('u-' + Date.now());
            localStorage.setItem('session', sessionId);

            try {
                let sb = null;
                for (let i = 0; i < 10; i++) {
                    if (window.supabase) {
                        sb = window.supabase.createClient('https://mzsipmeuthconogugwry.supabase.co', 'sb_publishable_AHLzBSVlyyQJSKIZFD2Nyg_R2WHJfMG');
                        break;
                    }
                    await new Promise(r => setTimeout(r, 100));
                }

                if (!sb) throw new Error('Supabase not loaded');

                const {data:stories,error:err1} = await sb.from('stories').select('id').eq('story_id', storyId).limit(1);
                if (err1 || !stories?.length) throw new Error('Story not found');

                const {error:err2} = await sb.from('votes').insert({story_id:stories[0].id,vote_type:type,user_id:sessionId});
                if (err2) throw err2;

                console.log(`Vote recorded: ${type}`);
            } catch(e) {
                console.error('Vote failed:', e);
            }
        }

        renderPreviewCards();
        renderMainContent();
        renderWord();
    </script>
</body>
</html>
