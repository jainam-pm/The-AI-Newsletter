<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Morning Prompt — Daily AI News</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #faf6eb;
            color: #1a1710;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            margin-bottom: 40px;
            border-bottom: 2px solid #d4a04a;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a1710;
            margin-bottom: 8px;
        }

        .header .meta {
            font-size: 14px;
            color: #666;
        }

        /* Two-column layout */
        .content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 40px;
            margin-bottom: 40px;
        }

        .stories {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .sidebar {
            padding: 20px;
            background: #2a1710;
            color: #faf6eb;
            border-radius: 8px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        /* Story card */
        .story {
            border: 1px solid #e0d5c7;
            border-radius: 4px;
            padding: 0;
            overflow: hidden;
            transition: box-shadow 0.2s ease;
        }

        .story:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .story-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            background: #fef9f3;
        }

        .story-number {
            font-size: 28px;
            font-weight: 300;
            color: #d4a04a;
            min-width: 40px;
            opacity: 0.6;
            line-height: 1;
        }

        .story-header-content {
            flex: 1;
        }

        .story-cat {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: white;
            margin-bottom: 8px;
        }

        .story-headline {
            font-size: 18px;
            font-weight: 700;
            color: #1a1710;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .story-deck {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }

        .story-body {
            display: none;
            padding: 20px;
            background: #fff;
            border-top: 1px solid #e0d5c7;
        }

        .story.expanded .story-body {
            display: block;
        }

        /* Story body sections */
        .story-visual {
            margin: 16px 0;
            padding: 16px;
            background: #fef9f3;
            border-radius: 4px;
            border-left: 3px solid #d4a04a;
        }

        .story-visual svg,
        .story-visual img {
            max-width: 100%;
            height: auto;
        }

        .story-rows {
            margin: 20px 0;
        }

        .story-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 12px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .story-row strong {
            color: #1a1710;
            font-weight: 600;
        }

        .story-row-value {
            color: #444;
        }

        .story-vs {
            margin: 20px 0;
            padding: 12px;
            background: #fef9f3;
            border-radius: 4px;
        }

        .story-vs-header {
            font-weight: 600;
            color: #1a1710;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .story-vs-item {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .story-vs-item strong {
            color: #1a1710;
        }

        .story-links {
            margin: 20px 0;
            padding: 12px;
            background: #fef9f3;
            border-radius: 4px;
        }

        .story-links-header {
            font-weight: 600;
            color: #1a1710;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .story-link {
            display: block;
            margin-bottom: 6px;
        }

        .story-link a {
            color: #2a6fa8;
            text-decoration: none;
            font-size: 14px;
        }

        .story-link a:hover {
            text-decoration: underline;
        }

        /* Voting */
        .story-votes {
            margin-top: 16px;
            display: flex;
            gap: 8px;
        }

        .vote-btn {
            padding: 6px 12px;
            border: 1px solid #d4a04a;
            background: transparent;
            color: #1a1710;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .vote-btn:hover {
            background: #d4a04a;
            color: #faf6eb;
        }

        /* Word of the Day */
        .word-of-day h2 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            color: #d4a04a;
            margin-bottom: 16px;
        }

        .word-card {
            background: #3a2710;
            padding: 16px;
            border-radius: 6px;
            color: #faf6eb;
        }

        .word-term {
            font-size: 20px;
            font-weight: 700;
            color: #d4a04a;
            margin-bottom: 8px;
        }

        .word-pos {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 12px;
        }

        .word-def {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #5a4a3a;
        }

        .word-why {
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .word-tie {
            font-size: 11px;
            color: #aaa;
            font-style: italic;
        }

        /* Expand/collapse */
        .story-toggle {
            display: none;
        }

        .story-toggle::after {
            content: " ▼";
            font-size: 12px;
        }

        .story.expanded .story-toggle::after {
            content: " ▲";
        }

        /* Mobile responsive */
        @media (max-width: 820px) {
            .content {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .sidebar {
                position: static;
            }

            .story-header {
                flex-direction: column;
                gap: 8px;
            }

            .story-number {
                min-width: auto;
            }

            .story-row {
                grid-template-columns: 1fr;
                gap: 4px;
            }

            .story-row strong::after {
                content: ": ";
            }
        }

        /* Print styles */
        @media print {
            body {
                background: white;
            }

            .story-body {
                display: block;
            }

            .sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>The Morning Prompt</h1>
            <div class="meta">
                Daily AI news digest • <span id="date"></span>
            </div>
        </div>

        <!-- Content Grid -->
        <div class="content">
            <!-- Stories -->
            <div class="stories" id="stories"></div>

            <!-- Sidebar: Word of the Day -->
            <div class="sidebar">
                <div class="word-of-day">
                    <h2>Word of the Day</h2>
                    <div class="word-card" id="word-card"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Story data (filled by Claude)
        const CATS = {
            models:   { label: "Models",              color: "#2a6fa8" },
            security: { label: "Security",            color: "#b33425" },
            privacy:  { label: "Agents & Privacy",    color: "#7a3ea0" },
            builders: { label: "Builders & Funding",  color: "#4db87a" },
            policy:   { label: "Policy",              color: "#d4a04a" },
            research: { label: "Research",            color: "#2a6fa8" },
            india:    { label: "India",               color: "#d4a04a" }
        };

        const STORIES = [
            // Claude fills this array
            // Format: { id, cat, n, head, deck, visual, rows, vs, links }
        ];

        const WORD = {
            // Claude fills this object
            // Format: { term, pos, def, why, tie }
        };

        // Render stories
        function renderStories() {
            const container = document.getElementById('stories');
            container.innerHTML = '';

            STORIES.forEach((story, idx) => {
                const catInfo = CATS[story.cat] || { label: "News", color: "#999" };

                // Build rows HTML
                let rowsHtml = '';
                if (story.rows && story.rows.length > 0) {
                    rowsHtml = '<div class="story-rows">';
                    story.rows.forEach(([label, value]) => {
                        rowsHtml += `
                            <div class="story-row">
                                <strong>${label}</strong>
                                <div class="story-row-value">${value}</div>
                            </div>
                        `;
                    });
                    rowsHtml += '</div>';
                }

                // Build vs HTML
                let vsHtml = '';
                if (story.vs && story.vs.length > 0) {
                    vsHtml = '<div class="story-vs"><div class="story-vs-header">🥊 What Others Are Doing</div>';
                    story.vs.forEach(([company, line]) => {
                        vsHtml += `<div class="story-vs-item"><strong>${company}:</strong> ${line}</div>`;
                    });
                    vsHtml += '</div>';
                }

                // Build links HTML
                let linksHtml = '';
                if (story.links && story.links.length > 0) {
                    linksHtml = '<div class="story-links"><div class="story-links-header">Source Links</div>';
                    story.links.forEach(([label, url]) => {
                        linksHtml += `<div class="story-link"><a href="${url}" target="_blank">${label}</a></div>`;
                    });
                    linksHtml += '</div>';
                }

                // Assemble story HTML
                const storyHtml = `
                    <div class="story" data-id="${story.id}">
                        <div class="story-header" onclick="toggleStory('${story.id}')">
                            <div class="story-number">${story.n}</div>
                            <div class="story-header-content">
                                <div class="story-cat" style="background-color: ${catInfo.color};">${catInfo.label}</div>
                                <div class="story-headline">${story.head}</div>
                                <div class="story-deck">${story.deck}</div>
                            </div>
                            <span class="story-toggle"></span>
                        </div>
                        <div class="story-body">
                            ${story.visual ? `<div class="story-visual">${story.visual}</div>` : ''}
                            <div onclick="event.stopPropagation()">
                                <a href="${story.links && story.links[0] ? story.links[0][1] : '#'}" target="_blank" style="color: #2a6fa8; text-decoration: none; font-weight: 600;">Read full story →</a>
                            </div>
                            ${rowsHtml}
                            ${vsHtml}
                            ${linksHtml}
                            <div class="story-votes">
                                <button class="vote-btn" onclick="voteStory('${story.id}', 'up')">👍 More like this</button>
                                <button class="vote-btn" onclick="voteStory('${story.id}', 'down')">👎 Less</button>
                            </div>
                        </div>
                    </div>
                `;

                container.innerHTML += storyHtml;
            });
        }

        // Render Word of the Day
        function renderWord() {
            const container = document.getElementById('word-card');
            if (!WORD.term) return;

            container.innerHTML = `
                <div class="word-term">${WORD.term}</div>
                <div class="word-pos">${WORD.pos || 'noun'}</div>
                <div class="word-def">${WORD.def}</div>
                <div class="word-why"><strong>Why it matters:</strong> ${WORD.why}</div>
                <div class="word-tie">${WORD.tie}</div>
            `;
        }

        // Toggle story expand
        function toggleStory(id) {
            const story = document.querySelector(`[data-id="${id}"]`);
            story.classList.toggle('expanded');
        }

        // Expand first story by default
        function expandLead() {
            if (STORIES.length > 0) {
                document.querySelector(`[data-id="${STORIES[0].id}"]`).classList.add('expanded');
            }
        }

        // Vote handler
        function voteStory(id, type) {
            console.log(`Vote: ${type} on story ${id}`);
            // TODO: Send to backend/log
        }

        // Set date
        function setDate() {
            const today = new Date().toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('date').textContent = today;
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            setDate();
            if (STORIES.length > 0) {
                renderStories();
                expandLead();
            }
            if (WORD.term) {
                renderWord();
            }
        });
    </script>
</body>
</html>
